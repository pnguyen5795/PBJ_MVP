<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Private beta · PBJ</title><link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}"><link rel="stylesheet" href="{{ url_for('static', path='/mobile-v2.css') }}"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png"><link rel="icon" href="/static/icons/pbj-192.png"></head>
<body class="access-body"><main class="access-shell"><div class="brand-wordmark brand-wordmark-large"><span>PB</span><b>J</b></div><p class="eyebrow">PRIVATE BETA</p><h1>Make the first cut feel more like you.</h1><p class="access-lead">Enter the access code to open your private PBJ workspace.</p>{% if error %}<div class="notice error">That code did not match. Try again.</div>{% endif %}<form class="access-form" action="/access" method="post"><label for="access-code">Access code</label><input id="access-code" name="code" type="password" autocomplete="one-time-code" autocapitalize="none" required autofocus placeholder="Enter code"><button class="button wide" type="submit">Open PBJ →</button></form><small>Access stays active on this device for 7 days.</small></main></body></html>
