<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Private beta · PBJ</title><link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}?v=21"><link rel="stylesheet" href="{{ url_for('static', path='/mobile-v2.css') }}?v=21"><link rel="stylesheet" href="{{ url_for('static', path='/troy-foundation.css') }}?v=21"><link rel="stylesheet" href="{{ url_for('static', path='/troy-screens.css') }}?v=21"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png"><link rel="icon" href="/static/icons/pbj-192.png"></head>
<body class="access-body"><main class="access-shell pbj-access pbj-screen-exact">
  <div class="pbj-access__intro">
    <img src="/static/brand/sandwich-logo.png" alt="PBJ" class="pbj-access__mark">
    <h1>Welcome to PBJ</h1>
    <p class="access-lead">Your footage. Your direction.<br>One strong first cut.</p>
  </div>
  <div class="pbj-access__entry">
    {% if error %}<div class="notice error" role="alert">That code did not match. Try again.</div>{% endif %}
    <form class="access-form" action="/access" method="post">
      <label for="access-code">Access code</label>
      <input id="access-code" name="code" type="password" autocomplete="one-time-code" autocapitalize="none" required autofocus placeholder="Enter access code">
      <button class="button wide" type="submit">Open PBJ</button>
    </form>
    <small>Access stays active on this device for 7 days.</small>
  </div>
</main></body></html>
