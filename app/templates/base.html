<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PBJ">
  <title>{% block title %}PBJ{% endblock %}</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="icon" href="/static/icons/pbj-192.png">
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='/workflow.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='/mobile-v2.css') }}?v=11">
  <link rel="stylesheet" href="{{ url_for('static', path='/troy-foundation.css') }}?v=11">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar desktop-navigation">
    <a class="sidebar-brand" href="/" aria-label="PBJ Home"><span class="brand-wordmark"><span>PB</span><b>J</b></span></a>
    <nav class="sidebar-nav">
      <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}"><span>⌂</span>Home</a>
      <a href="/projects" class="{{ 'active' if request.url.path.startswith('/projects') else '' }}"><span>▣</span>Projects</a>
      <a href="/styles" class="{{ 'active' if request.url.path.startswith('/styles') else '' }}"><span>◇</span>Recipe Lab</a>
      <a href="{{ '/settings' if request.session.owner else '/more' }}" class="{{ 'active' if request.url.path.startswith('/more') or request.url.path.startswith('/settings') or request.url.path.startswith('/assets') or request.url.path.startswith('/examples') else '' }}"><span>⚙</span>{{ 'Settings' if request.session.owner else 'More' }}</a>
    </nav>
    <div class="sidebar-bottom"><p>Private beta · Device workspace</p></div>
  </aside>
  <div class="workspace">
    <header class="workspace-top"><a href="/" class="compact-brand"><span class="brand-wordmark"><span>PB</span><b>J</b></span></a><span class="privacy-status"><i></i> Private workspace</span></header>
    <main>{% block content %}{% endblock %}</main>
  </div>
</div>
<nav class="mobile-tabbar" aria-label="Primary navigation">
  <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}"><span>⌂</span><small>Home</small></a>
  <a href="/projects" class="{{ 'active' if request.url.path.startswith('/projects') else '' }}"><span>▣</span><small>Projects</small></a>
  <a href="/more" class="{{ 'active' if request.url.path.startswith('/more') or request.url.path.startswith('/styles') or request.url.path.startswith('/settings') or request.url.path.startswith('/assets') or request.url.path.startswith('/examples') else '' }}"><span>•••</span><small>More</small></a>
</nav>
<script>
document.addEventListener('submit',function(e){const form=e.target;if(!form.matches('form')||form.dataset.noLoading==='true')return;const button=form.querySelector('button[type="submit"]');if(!button||button.disabled)return;button.dataset.originalText=button.textContent;button.disabled=true;button.classList.add('is-loading');button.innerHTML='<span class="button-spinner"></span> Working…';});
document.querySelectorAll('[data-elapsed-timer]').forEach(function(timer){const output=timer.querySelector('strong');const parsed=Date.parse(timer.dataset.startedAt||'');const started=Number.isFinite(parsed)?parsed:Date.now();function update(){const total=Math.max(0,Math.floor((Date.now()-started)/1000));const hours=Math.floor(total/3600);const minutes=Math.floor((total%3600)/60);const seconds=total%60;output.textContent=(hours?String(hours).padStart(2,'0')+':':'')+String(minutes).padStart(2,'0')+':'+String(seconds).padStart(2,'0')}update();setInterval(update,1000)});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js').catch(()=>{}));}
</script>
{% block scripts %}{% endblock %}
</body></html>
