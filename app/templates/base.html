<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PBJ">
  <title>{% block title %}PBJ{% endblock %}</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="icon" href="/static/icons/pbj-192.png">
  <link rel="stylesheet" href="/ui.css?v=22">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar desktop-navigation">
    <a class="sidebar-brand" href="/" aria-label="PBJ Home"><span class="brand-wordmark"><span>PB</span><b>J</b></span></a>
    <nav class="sidebar-nav">
      <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}"><span>⌂</span>Home</a>
      <a href="/projects" class="{{ 'active' if request.url.path.startswith('/projects') else '' }}"><span>▣</span>Projects</a>
      <a href="/styles" class="{{ 'active' if request.url.path.startswith('/styles') else '' }}"><span>◇</span>Recipe Lab</a>
      <a href="{{ '/settings' if request.session.owner else '/more' }}" class="{{ 'active' if request.url.path.startswith('/more') or request.url.path.startswith('/settings') or request.url.path.startswith('/assets') or request.url.path.startswith('/examples') else '' }}"><span>⚙</span>{{ 'Settings' if request.session.owner else 'More' }}</a>
    </nav>
    <div class="sidebar-bottom"><p>Private beta · Device workspace</p></div>
  </aside>
  <div class="workspace">
    <header class="workspace-top"><a href="/" class="compact-brand"><span class="brand-wordmark"><span>PB</span><b>J</b></span></a><span class="privacy-status"><i></i> Private workspace</span></header>
    <main>{% block content %}{% endblock %}</main>
  </div>
</div>
<script>
document.addEventListener('submit',function(e){const form=e.target;if(!form.matches('form')||form.dataset.noLoading==='true')return;const button=form.querySelector('button[type="submit"]');if(!button||button.disabled)return;button.dataset.originalText=button.textContent;button.disabled=true;button.classList.add('is-loading');button.innerHTML='<span class="button-spinner"></span> Working…';});
document.querySelectorAll('[data-elapsed-timer]').forEach(function(timer){const output=timer.querySelector('strong');const parsed=Date.parse(timer.dataset.startedAt||'');const started=Number.isFinite(parsed)?parsed:Date.now();function update(){const total=Math.max(0,Math.floor((Date.now()-started)/1000));const hours=Math.floor(total/3600);const minutes=Math.floor((total%3600)/60);const seconds=total%60;output.textContent=(hours?String(hours).padStart(2,'0')+':':'')+String(minutes).padStart(2,'0')+':'+String(seconds).padStart(2,'0')}update();setInterval(update,1000)});
// Migration cleanup only: remove the retired offline worker and its private shell cache.
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(items=>Promise.all(items.map(item=>item.unregister()))).catch(()=>{});}
if('caches' in window){caches.keys().then(keys=>Promise.all(keys.filter(key=>key.startsWith('pbj-shell-')).map(key=>caches.delete(key)))).catch(()=>{});}
window.pbjSafeRefresh=function(delay){
  let wait=Math.max(1000,Number(delay)||3000);
  async function refresh(){
    try{
      const response=await fetch(window.location.href,{credentials:'same-origin',cache:'no-store',headers:{'X-PBJ-Progress-Poll':'1'}});
      const contentType=response.headers.get('content-type')||'';
      if(response.ok&&contentType.includes('text/html')){
        const html=await response.text();
        if(response.url)history.replaceState(null,'',response.url);
        document.open();document.write(html);document.close();
        return;
      }
    }catch(error){}
    wait=Math.min(10000,Math.round(wait*1.5));
    window.setTimeout(refresh,wait);
  }
  window.setTimeout(refresh,wait);
};
</script>
{% block scripts %}{% endblock %}
<script>
(() => {
  let lastSent = 0;
  const reportActivity = () => {
    const now = Date.now();
    if (document.hidden || now - lastSent < 15000) return;
    lastSent = now;
    fetch('/api/demo/activity', {
      method: 'POST', credentials: 'same-origin', keepalive: true,
      headers: {'X-PBJ-Activity': 'visible-browser'}
    }).catch(() => {});
  };
  ['pointerdown', 'touchstart', 'keydown'].forEach(name =>
    window.addEventListener(name, reportActivity, {passive: true})
  );
  document.addEventListener('visibilitychange', reportActivity);
  reportActivity();
  window.setInterval(reportActivity, 60000);
})();
</script>
</body></html>
