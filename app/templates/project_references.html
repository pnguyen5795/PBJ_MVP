{% extends "base.html" %}{% block title %}Optional examples · PBJ{% endblock %}{% block content %}
<section class="pbj-teach-it pbj-screen-exact">
  <a href="/projects/new" class="pbj-back-button pbj-back-floating" aria-label="Back to Direction">‹</a>
  <div class="pbj-teach-it__body"><div class="pbj-teach-it__ask-hero"><h1 class="pbj-teach-it__title">Teach Us Your Style</h1><p class="pbj-teach-it__sub">show us a finished video that feels like what you want</p><span class="sr-only">This step is optional</span></div>
  <form class="reference-project-form pbj-teach-it__form" action="/projects/new/references" method="post" enctype="multipart/form-data">
    <div class="pbj-teach-it__dropzone-wrap"><label class="pbj-teach-it__dropzone" for="reference-input">
      <input id="reference-input" class="file-input-overlay" type="file" name="references" accept="video/*" multiple aria-label="Choose optional finished reference videos">
      <span class="pbj-teach-it__plus">＋</span><strong>Choose a video</strong><small>Tap to choose files · up to 5 videos</small>
    </label></div>
    <div id="reference-files" class="selected-files" aria-live="polite"></div>
    <p class="pbj-teach-it__privacy">PBJ studies these privately for this project.</p>
    <div class="pbj-teach-it__footer"><button class="button wide" type="submit">Use Example</button></div></form>
  <form class="pbj-teach-it__skip" action="/projects/new/references" method="post"><input type="hidden" name="skip" value="true"><button type="submit">Skip for now</button></form></div>
</section>{% endblock %}{% block scripts %}<script>
(function(){
  const input=document.getElementById('reference-input');
  const list=document.getElementById('reference-files');
  if(!input||!list)return;
  input.addEventListener('change',function(){
    const files=Array.from(input.files||[]);
    list.innerHTML=files.length
      ? '<div class="selected-files-head"><strong>'+files.length+' reference video'+(files.length===1?'':'s')+' selected</strong></div>'+files.map(function(file){return '<div class="selected-file"><span>▶</span><div><strong>'+file.name.replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})+'</strong><small>'+Math.round(file.size/1048576*10)/10+' MB</small></div></div>'}).join('')
      : '';
  });
})();
</script>{% endblock %}
