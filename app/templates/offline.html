<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff8f1">
  <title>Connection paused · PBJ</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/troy-foundation.css?v=19">
</head>
<body>
  <main class="pbj-access pbj-screen-exact">
    <section class="pbj-access__intro">
      <img src="/static/brand/sandwich-logo.png" alt="" class="pbj-access__mark">
      <p class="pbj-access__kicker">UPLOAD PAUSED</p>
      <h1>Your saved videos are safe</h1>
      <p class="access-lead">iPhone paused PBJ’s connection. Reconnect, then return to your upload to continue with the remaining videos.</p>
    </section>
    <section class="pbj-access__entry">
      <button class="button wide" type="button" onclick="location.reload()">Try connecting again</button>
      <small>Keep PBJ open until every selected video finishes uploading. You can leave once analysis begins.</small>
    </section>
  </main>
</body>
</html>
