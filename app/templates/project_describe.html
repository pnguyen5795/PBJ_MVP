{% extends "base.html" %}{% block title %}New project · PBJ{% endblock %}{% block content %}
<section class="pbj-create-flow">
  <header class="pbj-create-top"><a href="/" class="pbj-back-button" aria-label="Back to Home">‹</a><span>New Project</span><span class="pbj-create-step">1 of 4</span></header>
  <div class="pbj-progress" style="--pbj-progress:25%"><span></span></div>
  <div class="pbj-create-hero"><p class="step-count">THE DIRECTION</p><h1>Describe the video you want</h1><p>Share the feeling, pacing, story, or creator style in your own words.</p></div>
  <form class="form prompt-first-form pbj-create-form" action="/projects/new/describe" method="post">
    <label>Project name <span>Optional</span><input name="name" value="{{ draft.name or '' }}" placeholder="Flight day" autocomplete="off"></label>
    <label>Your direction
      <textarea class="pbj-recipe-field" name="description" rows="8" required placeholder="Make this feel fast, playful, and chronological, with a strong opening…">{{ draft.description or '' }}</textarea>
      <small>Plain language is perfect. PBJ handles the editing approach behind the scenes.</small>
    </label>
    <div class="wizard-actions"><a class="button secondary" href="/">Back</a><button class="button" type="submit">Next →</button></div>
  </form>
</section>{% endblock %}
