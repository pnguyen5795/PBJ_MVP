services:
  - type: web
    name: pbnj
    runtime: docker
    region: oregon
    plan: 1c-2g
    branch: codex/hosted-demo
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_DATA_DIR
        value: /tmp/pbj-data
      - key: PBJ_HOSTED_MODE
        value: "true"
      - key: PBJ_SHARED_WORKSPACE
        value: "true"
      - key: PBJ_SHARED_WORKSPACE_ID
        value: pbj-private-workspace
      - key: PBJ_HTTPS_ONLY
        value: "true"
      - key: PBJ_LOW_MEMORY_MODE
        value: "false"
      - key: PBJ_AGENT_MODEL
        value: gpt-5.6-luna
      - key: PBJ_EDITING_AGENT_MODEL
        value: gpt-5.6-luna
      - key: PBJ_REPAIR_AGENT_MODEL
        value: gpt-5.6-luna
      - key: PBJ_LEARNING_AGENT_MODEL
        value: gpt-5.6-luna
      - key: PBJ_AGENT_REASONING_EFFORT
        value: medium
      - key: TWELVE_LABS_MODEL
        value: pegasus1.5
      - key: PBJ_SESSION_SECRET
        generateValue: true
      - key: PBJ_ACCESS_CODE
        sync: false
      - key: PBJ_OWNER_CODE
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TWELVE_LABS_API_KEY
        sync: false
